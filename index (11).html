<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e5fa8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ใบขอสร้าง/ซ่อม</title>
<style>
:root{--b:#1e5fa8;--bg:#f2f5f9;--c:#fff;--t:#1d2733;--m:#6b7785;--ok:#1a9a52;--no:#d33c3c;--w:#e08a00}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--b);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:17px}header button{background:none;border:1px solid #fff8;color:#fff;border-radius:8px;padding:6px 10px}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--c);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cfd6df;border-radius:8px;font:inherit;background:#fff}
textarea{min-height:90px}
button.p{width:100%;padding:13px;border:0;border-radius:10px;background:var(--b);color:#fff;font:600 16px inherit;margin-top:14px}
button.g{background:var(--ok)}button.r{background:var(--no)}button:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;color:#fff}
.PENDING_LEADER,.PENDING_MGR{background:var(--w)}.SENT_MT{background:var(--b)}.MT_DONE{background:var(--ok)}.REJECTED{background:var(--no)}
.top{display:flex;justify-content:space-between;align-items:center}
.sm{font-size:13px;color:var(--m)}.ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ph img{width:92px;height:92px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
.ph .x{position:relative}.ph .x i{position:absolute;top:2px;right:2px;background:#000a;color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;font-style:normal;line-height:22px}
canvas{width:100%;height:150px;border:1px dashed #9aa6b4;border-radius:8px;background:#fff;touch-action:none}
.hide{display:none}.step{padding:8px 0;border-top:1px solid #eee;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:#dfe6ee;font:600 14px inherit}.tabs .on{background:var(--b);color:#fff}
</style>
</head>
<body>
<header><b>🔧 ใบขอสร้าง / ซ่อม</b><span id="who"></span></header>
<main>

<section id="vLogin" class="card hide">
  <label>รหัสพนักงาน</label><input id="lid" inputmode="numeric">
  <label>PIN</label><input id="lpin" type="password" inputmode="numeric">
  <button class="p" onclick="login()">เข้าสู่ระบบ</button><p id="lerr" class="sm"></p>
</section>

<section id="vApp" class="hide">
  <div class="tabs"><button id="tList" class="on" onclick="tab('list')">รายการ</button><button id="tNew" onclick="tab('new')">+ สร้างใบใหม่</button></div>
  <div id="list"></div>

  <form id="vNew" class="card hide" onsubmit="return submitNew(event)">
    <label>ประเภทงาน</label>
    <select id="f_type"><option>งานสร้าง (Design Job)</option><option>งานซ่อมเครื่องมือ/อุปกรณ์ (Repair Job)</option><option>งานอื่นๆ</option></select>
    <label>ชื่อชิ้นส่วน (Part Name)</label><input id="f_part">
    <div class="row"><div><label>ชื่อเครื่องจักร</label><input id="f_machine"></div><div><label>หมายเลขเครื่อง</label><input id="f_machineNo"></div></div>
    <div class="row"><div><label>จำนวน</label><input id="f_qty" inputmode="numeric"></div><div><label>วันที่กำหนดเสร็จ</label><input id="f_due" type="date"></div></div>
    <label>ความเร่งด่วน</label>
    <select id="f_urgent"><option>จำเป็นต้องเสร็จตามกำหนด</option><option>สามารถปรับกำหนดการได้</option></select>
    <label>รายละเอียดงาน / อาการผิดปกติ</label><textarea id="f_detail" required></textarea>
    <label>แนบรูปถ่าย (สูงสุด 6 รูป)</label>
    <input type="file" id="f_file" accept="image/*" multiple onchange="addPhotos(this)">
    <div class="ph" id="prev"></div>
    <button class="p" id="btnSend">ส่งใบขอสร้าง/ซ่อม</button>
  </form>
</section>

<section id="vDetail" class="hide"></section>
</main>

<script>
const API = 'https://script.google.com/macros/s/AKfycbw3IN6MyGf0GHh55eXsFQHtJXi8XRHvMDIN5gMc5TWq/dev';   // <-- URL จาก Deploy > Web app
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST = {PENDING_LEADER:'รอหัวหน้าอนุมัติ',PENDING_MGR:'รอ MGR อนุมัติ',SENT_MT:'ส่งแผนก MT แล้ว',MT_DONE:'MT ดำเนินการเสร็จ',REJECTED:'ไม่อนุมัติ'};
let U = JSON.parse(localStorage.getItem('mtu') || 'null'), rows = [], photos = [];

async function call(a, d = {}) {
  try {
    const r = await fetch(API, {method:'POST', body: JSON.stringify({a, id:U?.id, pin:U?.pin, ...d})});
    return await r.json();
  } catch (e) { return {ok:false, err:'เชื่อมต่อไม่ได้ (ออฟไลน์?)'}; }
}
function show(v){['vLogin','vApp','vDetail'].forEach(x=>$(x).classList.toggle('hide',x!==v))}

async function login() {
  U = {id:$('lid').value.trim(), pin:$('lpin').value.trim()};
  const r = await call('login');
  if (!r.ok) { U = null; $('lerr').textContent = r.err; return; }
  U = r.user; localStorage.setItem('mtu', JSON.stringify(U)); start();
}
function logout(){localStorage.removeItem('mtu');U=null;$('who').innerHTML='';show('vLogin')}
function start(){
  $('who').innerHTML = esc(U.name)+' <button onclick="logout()">ออก</button>';
  $('tNew').classList.toggle('hide', U.role!=='staff' && U.role!=='leader');
  show('vApp'); tab('list'); load();
}
function tab(t){
  $('tList').classList.toggle('on',t==='list');$('tNew').classList.toggle('on',t==='new');
  $('list').classList.toggle('hide',t!=='list');$('vNew').classList.toggle('hide',t!=='new');
}
function canAct(r){return (U.role==='leader'&&r.Status==='PENDING_LEADER')||(U.role==='mgr'&&r.Status==='PENDING_MGR')||(U.role==='mt'&&r.Status==='SENT_MT')}
async function load() {
  $('list').innerHTML = '<p class="sm">กำลังโหลด...</p>';
  const r = await call('list');
  if (!r.ok) { $('list').innerHTML = '<p class="sm">'+esc(r.err)+'</p>'; return; }
  rows = r.rows.sort((a,b)=>canAct(b)-canAct(a));
  $('list').innerHTML = rows.length ? rows.map((r,i)=>`
    <div class="card" onclick="detail(${i})">
      <div class="top"><b>${esc(r.ID)}</b><span class="tag ${r.Status}">${ST[r.Status]}</span></div>
      <div>${esc(r.Type)} — ${esc(r.PartName)}</div>
      <div class="sm">${esc(r.MachineName)} ${esc(r.MachineNo)} · ${esc(r.RequesterName)} · ${esc(r.CreatedAt)}</div>
      ${canAct(r)?'<div style="color:var(--w);font-weight:600;margin-top:6px">⏳ รอดำเนินการโดยคุณ</div>':''}
    </div>`).join('') : '<p class="sm">ยังไม่มีรายการ</p>';
}

/* ---------- แนบรูป (ย่อก่อนส่ง) ---------- */
function shrink(file, max = 1280) {
  return new Promise(res => {
    const im = new Image(); im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', .75));
    }; im.src = URL.createObjectURL(file);
  });
}
async function addPhotos(inp) {
  for (const f of inp.files) if (photos.length < 6) photos.push(await shrink(f));
  inp.value = ''; drawPrev();
}
function drawPrev(){$('prev').innerHTML = photos.map((p,i)=>`<div class="x"><img src="${p}"><i onclick="photos.splice(${i},1);drawPrev()">×</i></div>`).join('')}

async function submitNew(e) {
  e.preventDefault(); $('btnSend').disabled = true; $('btnSend').textContent = 'กำลังส่ง...';
  const g = k => $('f_'+k).value;
  const r = await call('create', {photos, data:{type:g('type'),part:g('part'),machine:g('machine'),machineNo:g('machineNo'),qty:g('qty'),due:g('due'),urgent:g('urgent'),detail:g('detail')}});
  $('btnSend').disabled = false; $('btnSend').textContent = 'ส่งใบขอสร้าง/ซ่อม';
  if (!r.ok) return alert(r.err);
  alert('ส่งแล้ว เลขที่ ' + r.id); e.target.reset(); photos = []; drawPrev(); tab('list'); load();
}

/* ---------- รายละเอียด + เซ็นอนุมัติ ---------- */
function stepHtml(name, by, at, sig, note) {
  return by ? `<div class="step"><b>${name}:</b> ${esc(by)} <span class="sm">${esc(at)}</span>${note?'<div class="sm">'+esc(note)+'</div>':''}${sig?`<br><img src="${sig}" style="height:56px">`:''}</div>`
            : `<div class="step sm">${name}: —</div>`;
}
function detail(i) {
  const r = rows[i]; let ph = []; try { ph = JSON.parse(r.Photos || '[]') } catch(e){}
  const act = canAct(r), isMT = U.role==='mt';
  $('vDetail').innerHTML = `<button class="p" style="background:#6b7785;margin:0 0 12px" onclick="show('vApp')">← กลับ</button>
  <div class="card"><div class="top"><b>${esc(r.ID)}</b><span class="tag ${r.Status}">${ST[r.Status]}</span></div>
    <p><b>${esc(r.Type)}</b><br>ชิ้นส่วน: ${esc(r.PartName)} · จำนวน ${esc(r.Qty)}<br>เครื่อง: ${esc(r.MachineName)} ${esc(r.MachineNo)}<br>
    กำหนดเสร็จ: ${esc(String(r.DueDate).slice(0,10))} (${esc(r.Urgent)})<br>แผนก: ${esc(r.Dept)} · ผู้ขอ: ${esc(r.RequesterName)}</p>
    <p>${esc(r.Detail).replace(/\n/g,'<br>')}</p>
    <div class="ph">${ph.map(u=>`<a href="${u}" target="_blank"><img src="${u}"></a>`).join('')}</div></div>
  <div class="card"><b>การอนุมัติ</b>
    ${stepHtml('1) หัวหน้า', r.LeaderBy, r.LeaderAt, r.LeaderSig, r.LeaderNote)}
    ${stepHtml('2) MGR', r.MgrBy, r.MgrAt, r.MgrSig, r.MgrNote)}
    ${stepHtml('3) แผนก MT', r.MTBy, r.MTAt, '', r.MTNote)}</div>
  ${act ? `<div class="card"><label>หมายเหตุ</label><textarea id="note"></textarea>
    ${isMT ? '<button class="p g" onclick="mtDone(\''+r.ID+'\')">ดำเนินการเสร็จ / ปิดงาน</button>' :
    `<label>ลายเซ็น</label><canvas id="sig"></canvas><button type="button" class="sm" onclick="clr()">ล้างลายเซ็น</button>
     <div class="row"><button class="p r" onclick="decide('${r.ID}',false)">ไม่อนุมัติ</button><button class="p g" onclick="decide('${r.ID}',true)">อนุมัติ</button></div>`}</div>` : ''}`;
  show('vDetail'); if (act && !isMT) pad();
}
let cv, cx, drawing, signed;
function pad() {
  cv = $('sig'); cv.width = cv.clientWidth * 2; cv.height = 300; cx = cv.getContext('2d');
  cx.lineWidth = 4; cx.lineCap = 'round'; signed = false;
  const pos = e => {const b = cv.getBoundingClientRect(); return [(e.clientX-b.left)*2,(e.clientY-b.top)*2]};
  cv.onpointerdown = e => {drawing = true; cx.beginPath(); cx.moveTo(...pos(e))};
  cv.onpointermove = e => {if(drawing){cx.lineTo(...pos(e)); cx.stroke(); signed = true}};
  cv.onpointerup = cv.onpointerleave = () => drawing = false;
}
function clr(){cx.clearRect(0,0,cv.width,cv.height);signed=false}
async function decide(rid, approve) {
  if (approve && !signed) return alert('กรุณาเซ็นชื่อก่อนอนุมัติ');
  if (!approve && !$('note').value.trim()) return alert('กรุณาใส่เหตุผลที่ไม่อนุมัติ');
  const r = await call('decide', {rid, approve, note:$('note').value, sig: signed ? cv.toDataURL('image/png') : ''});
  if (!r.ok) return alert(r.err); show('vApp'); load();
}
async function mtDone(rid) {
  const r = await call('mt', {rid, note:$('note').value});
  if (!r.ok) return alert(r.err); show('vApp'); load();
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
U ? start() : show('vLogin');
</script>
</body>
</html>
